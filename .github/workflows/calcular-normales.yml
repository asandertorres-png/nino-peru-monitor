# Calculo de las normales climaticas 1991-2020.
#
# Se ejecuta A MANO (pestana Actions -> "Calcular normales 1991-2020" ->
# "Run workflow"), no por cron: es una tarea de una sola vez cuyo producto,
# data/normales.json, queda versionado y lo lee el flujo diario.
#
# Corre aqui y no en una maquina local porque el runner de GitHub tiene
# salida a internet sin restricciones y aguanta hasta 6 horas por trabajo,
# de sobra para una corrida que toma entre 30 y 90 minutos.
#
# Si la corrida se corta, el avance parcial se commitea igual y basta con
# volver a lanzar el workflow: el script retoma desde donde quedo.

name: Calcular normales 1991-2020

on:
  workflow_dispatch:
    inputs:
      nivel:
        description: "Nivel: departamento (25 puntos, ~1 h) o provincia (195 puntos, varias horas; relanzar si se corta)"
        type: choice
        options: [departamento, provincia]
        default: departamento
      reiniciar:
        description: "Descartar el avance parcial y empezar de cero"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  normales:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # el tope de GitHub son 360; deja margen para commitear

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular normales
        id: calculo
        env:
          PYTHONPATH: scripts
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS="--nivel ${{ inputs.nivel }}"
          if [ "${{ inputs.reiniciar }}" = "true" ]; then ARGS="$ARGS --reiniciar"; fi
          python scripts/calcular_normales.py $ARGS

      - name: Verificar el producto
        if: success()
        env:
          PYTHONPATH: scripts
        run: python scripts/verificar_normales.py --nivel ${{ inputs.nivel }}

      # Inferencial: cruza la serie mensual guardada con el ONI historico de la NOAA
      - name: Sensibilidad al ENSO
        if: success()
        env:
          PYTHONPATH: scripts
        run: python scripts/sensibilidad.py --nivel ${{ inputs.nivel }}

      - name: Publicar resultado
        if: always()   # tambien cuando la corrida se corta: el parcial sirve para retomar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data
          for f in data/normales.json data/normales_provincias.json data/sensibilidad.json data/sensibilidad_provincias.json; do
            if [ -f "$f" ]; then cp "$f" docs/data/; fi
          done
          git add -A data/ docs/data/
          # el checkpoint esta en .gitignore para corridas locales, pero en el
          # runner se pierde al terminar el trabajo: se commitea a la fuerza
          # para que el siguiente lanzamiento retome desde donde quedo
          git add -f data/.normales*_parcial.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "datos: normales climaticas 1991-2020, nivel ${{ inputs.nivel }} (corrida automatica)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
