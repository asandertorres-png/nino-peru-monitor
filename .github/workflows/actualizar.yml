name: Actualizar datos del monitor

on:
  schedule:
    - cron: "17 */6 * * *"  # cada 6 horas (UTC), minuto 17. GitHub solo corre
                            # el cron desde la rama por defecto.
  workflow_dispatch:         # permite correrlo a mano desde la pestana Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial.py reconstruye desde los snapshots commiteados

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar indice ONI
        run: python scripts/fetch_oni.py
        working-directory: .
        env:
          PYTHONPATH: scripts

      - name: Verificar normales climaticas
        run: python scripts/verificar_normales.py
        env:
          PYTHONPATH: scripts

      - name: Construir estado por departamento
        run: python scripts/actualizar.py
        env:
          PYTHONPATH: scripts

      - name: Historial diario (una fila por dia)
        run: python scripts/historial.py
        env:
          PYTHONPATH: scripts

      # El nivel provincial se publica solo cuando sus normales ya existen
      # (se calculan a mano con el workflow "Calcular normales 1991-2020").
      - name: Verificar y construir estado por provincia
        if: hashFiles('data/normales_provincias.json') != ''
        run: |
          python scripts/verificar_normales.py --nivel provincia
          python scripts/actualizar.py --nivel provincia
        env:
          PYTHONPATH: scripts

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/*.json docs/data/
          git add data/ docs/data/
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "datos: actualizacion automatica $(date -u +%Y-%m-%d)"
            # la corrida dura minutos: si entre tanto entro otro commit en la rama, se
            # rebasa encima (ante un conflicto en los datos, prevalece lo recien generado)
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
