name: Gasto publico PP 0068 (MEF)

on:
  schedule:
    - cron: "43 11 * * *"   # una vez al dia, 06:43 Lima. El archivo del MEF
                            # se actualiza a diario y pesa varios GB.
  workflow_dispatch:
    inputs:
      modo:
        description: "calcular (escribe data/gasto_pp0068.json) o inspeccionar (solo imprime recursos, encabezado y muestra)"
        type: choice
        options: [calcular, inspeccionar]
        default: calcular
      anio:
        description: "Anio fiscal (vacio = el actual)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  gasto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer el gasto del PP 0068 desde el MEF (streaming)
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.modo }}" = "inspeccionar" ]; then ARGS="--inspeccionar"; fi
          if [ -n "${{ github.event.inputs.anio }}" ]; then ARGS="$ARGS --anio ${{ github.event.inputs.anio }}"; fi
          python scripts/gasto.py $ARGS
        env:
          PYTHONPATH: scripts

      - name: Publicar
        if: github.event.inputs.modo != 'inspeccionar'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/gasto_pp0068.json docs/data/
          git add data/gasto_pp0068.json docs/data/gasto_pp0068.json
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "datos: gasto PP 0068 (MEF) $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
